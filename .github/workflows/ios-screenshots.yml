name: Capture StorySitting App Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require App Store SDK
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and capture shipping views
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          runtime_id="$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))] | last | .identifier')"
          device_type="$(xcrun simctl list devicetypes -j | jq -r '(([.devicetypes[] | select(.name == "iPhone 17 Pro Max")] | first) // ([.devicetypes[] | select(.name | test("^iPhone .*Pro Max$"))] | first)) | .identifier')"
          test -n "$runtime_id"
          test -n "$device_type"
          device_id="$(xcrun simctl create 'StorySitting Store Capture' "$device_type" "$runtime_id")"
          trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true; xcrun simctl delete "$device_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild \
            -project StorySitting.xcodeproj \
            -scheme StorySitting \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/StorySittingScreenshots" \
            build \
            CODE_SIGNING_ALLOWED=NO
          app_path="$RUNNER_TEMP/StorySittingScreenshots/Build/Products/Debug-iphonesimulator/StorySitting.app"
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl status_bar "$device_id" override --time '9:41' --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          mkdir -p "$RUNNER_TEMP/StorySittingStoreShots"
          for mode in shelf project chapter questions pricing start login; do
            xcrun simctl terminate "$device_id" com.amflimited.storysitting >/dev/null 2>&1 || true
            xcrun simctl launch "$device_id" com.amflimited.storysitting -StorySittingScreenshot "$mode"
            sleep 5
            xcrun simctl io "$device_id" screenshot --type=png "$RUNNER_TEMP/StorySittingStoreShots/${mode}.png"
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: StorySitting-App-Store-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/StorySittingStoreShots/*.png
          if-no-files-found: error
          retention-days: 14
