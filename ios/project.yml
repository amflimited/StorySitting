name: StorySitting

options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  StorySittingCore:
    path: Packages/StorySittingCore

fileGroups:
  - Config/StorySitting.storekit
  - README.md
  - project.yml
  - scripts

targets:
  StorySitting:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StorySitting
    dependencies:
      - package: StorySittingCore
        product: StorySittingCore
    info:
      path: StorySitting/Info.plist
      properties:
        CFBundleDisplayName: StorySitting
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_VERSION: 5.9
        PRODUCT_BUNDLE_IDENTIFIER: com.amflimited.storysitting
        PRODUCT_NAME: StorySitting
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        VERSIONING_SYSTEM: apple-generic

schemes:
  StorySitting:
    build:
      targets:
        StorySitting: all
    run:
      config: Debug
      storeKitConfiguration: Config/StorySitting.storekit
    archive:
      config: Release
